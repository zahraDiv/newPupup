<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Popup UI</title>

<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial;
}

/* background */
body{
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg,#ff9a9e,#fad0c4,#a6c1ee);
}



/* button */
button{
    width: 200px;
    height: 60px;
    border: none;
    border-radius: 40px;
    background: white;
    color: #ff4d6d;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 12px 30px rgba(0,0,0,.2);
    transition: .3s;
}

button:hover{
    transform: scale(1.05);
}

/* overlay */
#overlay{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(2px);

    opacity: 0;
    pointer-events: none;
    transition: 0.3s ease;
}

#overlay.active{
    opacity: 1;
    pointer-events: auto;
}

/* popup */
#popup{
    width: 380px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(12px);

    border-radius: 28px;
    box-shadow: 0 25px 70px rgba(0,0,0,.25);

    position: absolute;
    top: 50%;
    left: 50%;

    transform: translate(-50%,-50%) scale(0.3);
    opacity: 0;

    pointer-events: none;

    transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);

    padding: 30px;
    text-align: center;
    z-index: 10;
}

/* active popup */
#popup.active{
    opacity: 1;
    transform: translate(-50%,-50%) scale(1);
    pointer-events: auto;
}

/* close */
#popup span{
    position: absolute;
    top: 15px;
    right: 18px;
    font-size: 26px;
    cursor: pointer;
    color: #aaa;
}

#popup span:hover{
    color: #ff4d6d;
}

/* image */
#popup img{
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #ff7eb3;
    margin-top: 10px;
}

/* text */
#popup h1{
    margin-top: 15px;
    color: #ff4d6d;
}

#popup p{
    color: #666;
    margin: 10px 0 20px;
}

/* inputs */
#popup input{
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: none;
    background: #f5f5f5;
    border-radius: 12px;
    outline: none;
}

#popup input:focus{
    outline: 2px solid #ff7eb3;
}

/* button */
#popup .btn{
    width: 100%;
    margin-top: 15px;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg,#ff7eb3,#ff4d6d);
    color: white;
    font-size: 18px;
    cursor: pointer;
}
</style>
</head>

<body>

<button onclick="showpopup()">Click Me</button>

<div id="overlay"></div>

<div id="popup">

    <span onclick="closepopup()">✖️</span>

    <img src="img/IMG_20260611_113704_448.webp" />

    <h1>Welcome 👋</h1>
    <p>Join us and enjoy the experience</p>

    <input type="text" placeholder="Your name">
    <input type="email" placeholder="Your email">

    <button class="btn">Subscribe</button>

</div>

<script>
const mypop = document.getElementById('popup')
const overlay = document.getElementById('overlay')

function showpopup(){
    mypop.classList.add('active')
    overlay.classList.add('active')
    
}

function closepopup(){
    mypop.classList.remove('active')
    overlay.classList.remove('active')
    document.body.classList.remove('blur')
}

overlay.onclick = closepopup
</script>

</body>
</html>
